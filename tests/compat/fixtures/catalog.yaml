schema_version: 2
day_boundary: UTC+05:30
dialect: duckdb
sources:
  events:
    relation:
      kind: sql
      sql: >-
        SELECT * FROM (VALUES
        (1, 101, TIMESTAMP '2025-01-01', 4.0, 'mobile'),
        (2, 202, TIMESTAMP '2025-01-02', 8.0, 'web')
        ) AS t(user_id, account_id, occurred_at, amount, platform)
    time: occurred_at
    units: {user_id: user_id, account_id: account_id}
    events: [spend, purchase, visit]
    properties: [events.platform]
    dimensions: [region]
  other_events:
    relation:
      kind: sql
      sql: >-
        SELECT * FROM (VALUES
        (3, TIMESTAMP '2025-01-03', 2.0, 'paid')
        ) AS t(user_id, occurred_at, amount, channel)
    time: occurred_at
    units: {user_id: user_id}
    events: [other_spend]
    properties: [other_events.platform]
    dimensions: [region, lifecycle, changes]
events:
  spend: {source: events, column: amount}
  purchase: {source: events, column: amount}
  visit: {source: events, column: null}
  other_spend: {source: other_events, column: amount}
properties:
  events.platform: {source: events, column: platform, dtype: string, as_of: event_time}
  other_events.platform: {source: other_events, column: channel, dtype: string, as_of: pre_exposure}
  region: {source: events, column: region, dtype: string, as_of: event_time, dimension: region}
  status: {source: other_events, column: status, dtype: string, as_of: static, dimension: lifecycle}
  level: {source: other_events, column: level, dtype: string, as_of: event_time, dimension: changes}
dimensions:
  region:
    relation:
      kind: sql
      sql: >-
        SELECT * FROM (VALUES
        (1, TIMESTAMP '2024-01-01', TIMESTAMP '2026-01-01', 'west'),
        (2, TIMESTAMP '2024-01-01', TIMESTAMP '2026-01-01', 'east')
        ) AS t(user_id, valid_from, valid_to, region)
    unit: user_id
    key: user_id
    validity: {valid_from: valid_from, valid_to: valid_to}
    properties: [region]
  lifecycle:
    relation:
      kind: sql
      sql: SELECT * FROM (VALUES (3, 'active')) AS t(user_id, status)
    unit: user_id
    key: user_id
    validity: null
    properties: [status]
  changes:
    relation:
      kind: sql
      sql: SELECT * FROM (VALUES (3, TIMESTAMP '2025-01-01', 'gold')) AS t(user_id, changed_at, level)
    unit: user_id
    key: user_id
    validity: {changed_at: changed_at}
    properties: [level]
measures:
  revenue:
    event: spend
    aggregation: sum
    filters: [{property: region, op: equals, values: [west]}]
    window_days: 30
  purchases:
    event: purchase
    aggregation: count
    filters: [{property: region, op: in, values: [west, east]}]
    window_days: 7
  ratio.numerator:
    event: spend
    aggregation: sum
    filters: [{property: region, op: equals, values: [west]}]
    window_days: 30
  ratio.denominator:
    event: purchase
    aggregation: count
    window_days: 30
  other_revenue:
    event: other_spend
    aggregation: avg_event
    filters:
      - {property: other_events.platform, op: equals, values: [paid]}
      - {property: status, op: equals, values: [active]}
      - {property: level, op: equals, values: [gold]}
      - {property: region, op: equals, values: [west]}
    window_days: 30
metrics:
  revenue: {kind: mean, unit: user_id, measure: revenue, winsorization: {lower_value: 0.0, upper_percentile: 0.99}}
  purchases: {kind: conversion, unit: account_id, measure: purchases}
  ratio: {kind: ratio, unit: user_id, numerator: ratio.numerator, denominator: ratio.denominator}
  other_revenue: {kind: mean, unit: user_id, measure: other_revenue}
