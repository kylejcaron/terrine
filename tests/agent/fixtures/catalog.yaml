schema_version: 1
day_boundary: UTC
dialect: duckdb
sources:
  events:
    relation: {kind: table, name: events}
    timestamp: ts
    entities: {user: user_id}
    facts: [value]
    properties: []
    dimensions: []
facts:
  value: {source: events, column: value}
properties: {}
dimensions: {}
measures:
  total: {fact: value, aggregation: sum}
metrics:
  total: {kind: mean, entity: user, measure: total}
