name: warehouse-backends

# Live warehouse probes. PostgreSQL runs against a service container and needs
# no credentials; selected probes fail, never skip, when settings are missing.
on:
  workflow_dispatch:
    inputs:
      backend_mode:
        description: Backend probes to run
        type: choice
        options: [all, postgres]
        default: all
  workflow_call:
    inputs:
      backend_mode:
        description: "Backend probes to run: all or postgres."
        required: false
        type: string
        default: all

permissions:
  contents: read

jobs:
  # Invalid reusable-workflow inputs must fail, not skip every backend.
  reject-unknown-backend-mode:
    if: ${{ inputs.backend_mode != 'all' && inputs.backend_mode != 'postgres' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::backend_mode must be all or postgres; got '$MODE'"
          exit 1
        env: {MODE: "${{ inputs.backend_mode }}"}

  postgres:
    if: ${{ inputs.backend_mode == 'all' || inputs.backend_mode == 'postgres' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: terrine, POSTGRES_DB: terrine_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TERRINE_TEST_POSTGRES_HOST: localhost
      TERRINE_TEST_POSTGRES_PORT: "5432"
      TERRINE_TEST_POSTGRES_USER: postgres
      TERRINE_TEST_POSTGRES_PASSWORD: terrine
      TERRINE_TEST_POSTGRES_DB: terrine_test
      PYTEST_ADDOPTS: -n auto
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --extra duckdb --extra postgres
      - run: make test-postgres
      - run: uv run python examples/postgres/dataset.py
        env:
          TERRINE_POSTGRES_URL: postgres://postgres:terrine@localhost:5432/terrine_test
