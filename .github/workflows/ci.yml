name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  # Each pushed commit runs every job once. A branch push defers to the
  # pull-request run of the same commit when one exists; GitHub runs none for a
  # pull request with merge conflicts, so an open pull request alone does not
  # defer. Other events and tag pushes always run every job.
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      defer: ${{ steps.scope.outputs.defer }}
    steps:
      - if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: actions/checkout@v4
      - id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          LOOKUP: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') }}
        run: |
          set -euo pipefail
          if [ "$LOOKUP" = true ]; then
            python3 scripts/ci_scope.py --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY"
          else
            echo "defer=false" >> "$GITHUB_OUTPUT"
          fi
  checks:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --group docs --all-extras
      - run: make lint
      - run: make typecheck
  unit:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --all-extras
      - run: >-
          /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -q tests
          -n auto --splits 2 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --durations-path tests/.test_durations
          --ignore=tests/temporal/test_sketches.py
          --ignore=tests/spec/test_sketch_refusal.py
          --ignore=tests/compile/test_nonadditive.py
          --ignore=tests/compat
          --ignore=tests/parity
  integration:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Groups are balanced from integration/.test_durations; tests without a
        # stored duration get the average and are still assigned to a group.
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --all-extras
      - run: >-
          /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -q integration
          -n auto --dist loadscope --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm duration_based_chunks
          --durations-path integration/.test_durations
          --ignore=integration/parity
          --ignore=integration/handoffs
      # The same known answers compiled through the portable base expression
      # policy; about twenty seconds beside the native run.
      - if: matrix.group == 1
        run: /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -q -n auto integration/conformance --generic-dialect
  docs-and-examples:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --group docs --all-extras
      - run: uv run --group docs python -m tests.documentation --build
      - run: uv build
  # Builds once per resolution and installs those distributions on every
  # supported Python in turn.
  distributions:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: |
            3.12
            3.13
            3.14
      - run: uv build
      - env:
          RESOLUTION: ${{ matrix.resolution }}
        run: |
          set -euo pipefail
          for python in 3.12 3.13 3.14; do
            uv run --no-project --python "$python" python \
              -m tests.integration.distribution_smoke \
              --wheel dist/*.whl --sdist dist/*.tar.gz \
              --python "$python" --resolution "$RESOLUTION"
          done

  # Suites for optional extras, in turn. Each re-syncs with exactly its own
  # extras, so every extra is proven without the others installed.
  optional-suites:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync sketches extras
        run: uv sync --group dev --extra duckdb --extra pandas --extra sketches
      - run: /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -n auto tests/temporal/test_sketches.py tests/spec/test_sketch_refusal.py tests/compile/test_nonadditive.py -q
      - name: Sync increment compatibility extras
        run: uv sync --locked --group dev --extra duckdb --extra increment
      - run: /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -n auto tests/compat tests/parity
      - run: /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -n auto integration/parity
      - name: Sync library hand-off extras
        run: uv sync --locked --group dev --extra duckdb --extra doubleml --extra dowhy --extra duckreg --extra lifelines --extra diff-diff
      - run: /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -q -n auto integration/handoffs

  postgres:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    uses: ./.github/workflows/warehouse-backends.yml
    with:
      backend_mode: postgres

  conformance-newest-python:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.14"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --group dev --extra duckdb
      - run: /usr/bin/time -f "terrine-pytest-cpu %U %S" uv run pytest -q -n auto integration/conformance

  # Signatures of the stable API against the newest v1.* release tag; passes
  # until the first 1.x release is tagged. The comparison needs every tag and
  # the history they point to.
  api-compat:
    needs: scope
    if: needs.scope.outputs.defer != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev
      - run: uv run python scripts/api_check.py

  # Single check to require in branch protection. Matrix jobs report one check
  # per entry, so requiring them individually means editing the ruleset every
  # time a matrix changes. GitHub reports a job skipped by a condition as
  # successful, so a deferred run renames this job and never reports a check
  # named exactly `ci-ok`; the pull-request run reports it instead.
  ci-ok:
    name: ${{ needs.scope.outputs.defer == 'true' && 'ci-ok (checked by the pull request run)' || 'ci-ok' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - scope
      - checks
      - unit
      - integration
      - docs-and-examples
      - distributions
      - optional-suites
      - postgres
      - conformance-newest-python
      - api-compat
    if: always()
    permissions: {}
    steps:
      - name: Require every job to succeed
        env:
          DEFER: ${{ needs.scope.outputs.defer }}
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          if [ "$DEFER" = true ]; then
            echo "The pull-request run of this commit runs and checks every job."
            exit 0
          fi
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          failed=$(echo "$NEEDS" | jq -r '[to_entries[] | select(.value.result != "success") | .key] | join(", ")')
          if [ -n "$failed" ]; then
            echo "::error::jobs did not succeed: $failed"
            exit 1
          fi
