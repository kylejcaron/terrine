name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev --extra duckdb --extra pandas
      - run: make check TESTS="tests/test_windows.py tests/test_errors.py tests/test_metadata.py tests/spec tests/semantic tests/temporal/test_semantic_binding.py tests/temporal/test_readiness.py tests/simulate tests/reference/test_baseline.py tests/fixtures/test_baseline.py tests/estimate tests/diagnostics"
      - run: uv build
