name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# A newer push supersedes an in-flight run of the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true


jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --group docs --all-extras
      - run: make lint
      - run: make typecheck
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --all-extras
      - run: >-
          uv run pytest -q tests
          --splits 4 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --durations-path tests/.test_durations
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Groups are balanced from integration/.test_durations; tests without a
        # stored duration get the average and are still assigned to a group.
        group: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --all-extras
      - if: matrix.group == 1
        run: uv run python -m tests.integration.study_api_smoke
      - run: >-
          uv run pytest -q integration
          --splits 6 --group ${{ matrix.group }}
          --splitting-algorithm least_duration
          --durations-path integration/.test_durations
  docs-and-examples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --group docs --all-extras
      - run: |
          for example in examples/*.py; do
            uv run python "$example"
          done
      - run: uv run --group docs python -m tests.documentation --build
      - run: uv build
  distributions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
        resolution: [highest, lowest-direct]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: uv build
      - run: >-
          uv run --no-project --python "${{ matrix.python }}" python
          -m tests.integration.distribution_smoke
          --wheel dist/*.whl --sdist dist/*.tar.gz
          --python "${{ matrix.python }}" --resolution "${{ matrix.resolution }}"
  sketches:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev --extra duckdb --extra pandas --extra sketches
      - run: uv run pytest tests/temporal/test_sketches.py tests/spec/test_sketch_refusal.py tests/compile/test_nonadditive.py -q

  postgres:
    uses: ./.github/workflows/warehouse-backends.yml
    with:
      backend_mode: postgres

  increment-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --extra duckdb --extra increment
      - run: uv run pytest tests/compat tests/parity
      - run: uv run pytest integration/parity

  library-handoffs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --extra duckdb --extra doubleml --extra dowhy --extra duckreg --extra lifelines --extra diff-diff
      - run: uv run pytest -q integration/handoffs
