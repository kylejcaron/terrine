name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev --extra duckdb --extra pandas
      - run: make check TESTS="tests/test_windows.py tests/test_errors.py tests/test_metadata.py tests/spec tests/semantic tests/temporal/test_semantic_binding.py tests/temporal/test_readiness.py tests/temporal/test_scd2_attributes.py tests/temporal/test_sparse_state.py tests/temporal/test_prefix_lookup.py tests/temporal/test_window_aggregates.py tests/compile tests/execution tests/runtime tests/test_frame.py tests/test_frame_runtime.py tests/simulate tests/reference/test_baseline.py tests/fixtures/test_baseline.py tests/estimate tests/diagnostics tests/integration/test_baseline_recovery.py tests/integration/test_baseline_metadata.py"
      - run: uv run pytest tests/temporal/test_window_aggregates.py tests/compile/test_columns.py tests/compile/test_state_panel.py tests/spec/test_state_panel.py tests/test_frame_runtime.py -m slow
      - run: uv run python -m tests.integration.study_api_smoke
      - run: uv run python tests/integration/native_estimation_smoke.py
      - run: uv run python examples/state_panel.py
      - run: uv build

  warehouse-runtime:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --group dev --extra duckdb --extra pandas
      - run: uv run pytest integration/warehouse_execution/test_duckdb_runtime_recovery.py integration/warehouse_execution/test_request_replay_process.py integration/warehouse_execution/test_runtime_control.py integration/warehouse_execution/test_saved_plan_restart.py -q

  increment-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --extra duckdb --extra increment
      - run: make check TESTS="tests/compat tests/parity"
      - run: uv run pytest tests/compat tests/parity -m slow
