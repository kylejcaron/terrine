name: release

# Tag-driven release: pushing a vX.Y.Z tag whose version equals
# `project.version` in pyproject.toml builds, verifies and publishes to PyPI,
# then creates a GitHub Release.
#
# Publishing uses PyPI Trusted Publishing (OIDC). No API token is stored.
# PyPI publisher settings:
#   owner: kylejcaron   repository: terrine
#   workflow: release.yml   environment: pypi
# Configure required reviewers on the `pypi` environment so a pushed tag alone
# cannot publish.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
      cloud_evidence: ${{ steps.release-checks.outputs.cloud_evidence }}
      notes_attempt: ${{ steps.release-checks.outputs.notes_attempt }}
      notes_artifact_id: ${{ steps.release-notes.outputs.artifact-id }}
    steps:
      - name: Require a version tag
        env:
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          case "$REF" in
            refs/tags/v*) ;;
            *) echo "::error::release requires a v* tag ref, not a branch"; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: true

      - name: Require release checks for this commit
        id: release-checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/require_green_ci.py --sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          --prepare-notes "$RUNNER_TEMP/release-notes/notes.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: release-notes
        if: steps.release-checks.outputs.cloud_evidence == 'waiver'
        with:
          name: release-notes-${{ github.run_attempt }}
          path: ${{ runner.temp }}/release-notes/notes.md
          if-no-files-found: error

      - run: uv build --sdist --wheel --out-dir dist

      - name: Verify distributions
        run: |
          uv run --no-project --python 3.12 python -m tests.integration.distribution_smoke \
            --wheel dist/*.whl --sdist dist/*.tar.gz --python 3.12 --resolution highest

      - name: Verify built version matches the tag
        id: check
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          # Wheel filename is {name}-{version}-{python}-{abi}-{platform}.whl
          whl=$(ls dist/*.whl)
          built=$(basename "$whl" | cut -d- -f2)
          echo "tag=$tag built=$built"

          if [ "$tag" != "$built" ]; then
            echo "::error::tag v$tag does not match built version $built (pyproject.toml project.version)."
            exit 1
          fi

          # PyPI rejects PEP 440 local versions; fail before publishing.
          case "$built" in
            *+*) echo "::error::version $built has a local segment; PyPI will reject it"; exit 1 ;;
          esac

          # a/b/rc/dev -> mark the GitHub Release as a prerelease
          if printf '%s' "$built" | grep -Eq '(a|b|rc|\.dev)[0-9]+'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$built" >> "$GITHUB_OUTPUT"

      - name: Check metadata renders on PyPI
        run: uvx twine check --strict dist/*

      - name: Verify artifacts actually contain the package
        shell: bash
        run: |
          set -euo pipefail
          # hatchling builds a metadata-only wheel when the package directory is
          # missing; refuse to publish an empty package, since PyPI versions can
          # never be reused.
          python3 - <<'PY'
          import glob, sys, tarfile, zipfile

          def one(pattern):
              hits = glob.glob(pattern)
              if not hits:
                  sys.exit(f"::error::no artifact matching {pattern} -- the build produced nothing")
              if len(hits) > 1:
                  sys.exit(f"::error::expected exactly one {pattern}, found {len(hits)}: {hits}")
              return hits[0]

          whl = one("dist/*.whl")
          mods = [n for n in zipfile.ZipFile(whl).namelist()
                  if n.startswith("terrine/") and n.endswith(".py")]
          if not mods:
              sys.exit(f"::error::{whl} contains no terrine/*.py modules")
          print(f"wheel: {len(mods)} module(s)")

          sdist = one("dist/*.tar.gz")
          with tarfile.open(sdist) as tf:
              src = [n for n in tf.getnames()
                     if "/terrine/" in n and n.endswith(".py")]
          if not src:
              sys.exit(f"::error::{sdist} contains no terrine/ sources")
          print(f"sdist: {len(src)} module(s)")
          PY

      - name: Classify saved-format changes from the published predecessor
        id: upgrade-route
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$PWD"/dist/*.whl)
          uv run --no-project --python 3.12 --with packaging python scripts/release_upgrade.py \
            "${wheels[0]}" --github-output "$GITHUB_OUTPUT" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Prove saved-format upgrade with the built wheel
        id: upgrade
        env:
          PROOF_REQUIRED: ${{ steps.upgrade-route.outputs.proof_required }}
          PREDECESSOR_SHA256: ${{ steps.upgrade-route.outputs.predecessor_sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          wheels=("$PWD"/dist/*.whl)
          wheel="${wheels[0]}"
          checksum=$(sha256sum -- "$wheel")
          digest="${checksum%% *}"
          case "$PROOF_REQUIRED" in
            true)
              uv sync --locked --extra duckdb
              proof="$RUNNER_TEMP/release-upgrade.log"
              TERRINE_UPGRADE_CANDIDATE_WHEEL="$wheel" PYTEST_ADDOPTS=-s \
                make test-scale SCALE_TESTS=integration/test_release_upgrade.py | tee "$proof"
              grep -Fx "Candidate wheel SHA-256: $digest" "$proof"
              grep -Fx "Published predecessor SHA-256: $PREDECESSOR_SHA256" "$proof"
              ;;
            false) ;;
            *) echo "::error::Missing saved-format proof decision."; exit 1 ;;
          esac
          echo "Candidate wheel SHA-256: $digest" >> "$GITHUB_STEP_SUMMARY"
          echo "wheel=$(basename "$wheel")" >> "$GITHUB_OUTPUT"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"

      - name: Verify the wheel digest before upload
        env:
          WHEEL: ${{ steps.upgrade.outputs.wheel }}
          WHEEL_SHA256: ${{ steps.upgrade.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  dist/%s\n' "$WHEEL_SHA256" "$WHEEL" | sha256sum --check

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: |
            dist/${{ steps.upgrade.outputs.wheel }}
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/terrine/${{ needs.build.outputs.version }}
    permissions:
      actions: read
      contents: read
      # Publishing uses OIDC; the read token only verifies waiver approval.
      id-token: write
    steps:
      - name: Require a release evidence decision
        env:
          CLOUD_EVIDENCE: ${{ needs.build.outputs.cloud_evidence }}
          NOTES_ATTEMPT: ${{ needs.build.outputs.notes_attempt }}
          NOTES_ARTIFACT_ID: ${{ needs.build.outputs.notes_artifact_id }}
        run: |
          case "$CLOUD_EVIDENCE" in
            green) ;;
            waiver)
              if [ "$NOTES_ATTEMPT" != "$GITHUB_RUN_ATTEMPT" ] || [ -z "$NOTES_ARTIFACT_ID" ]; then
                echo "::error::Re-run all jobs to prepare exact waiver notes for this attempt."
                exit 1
              fi
              ;;
            *) echo "::error::Missing release evidence decision."; exit 1 ;;
          esac

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.build.outputs.cloud_evidence == 'waiver'
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.cloud_evidence == 'waiver'
        with:
          artifact-ids: ${{ needs.build.outputs.notes_artifact_id }}
          path: ${{ runner.temp }}/release-notes

      - name: Verify owner approval of exact notes before publishing
        if: needs.build.outputs.cloud_evidence == 'waiver'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/require_green_ci.py --sha "$GITHUB_SHA" --tag "$GITHUB_REF_NAME"
          --verify-notes "$RUNNER_TEMP/release-notes/notes.md"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true
          print-hash: true

  github-release:
    needs: [build, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.build.outputs.cloud_evidence == 'waiver'
        with:
          artifact-ids: ${{ needs.build.outputs.notes_artifact_id }}
          path: ${{ runner.temp }}/release-notes

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
          CLOUD_EVIDENCE: ${{ needs.build.outputs.cloud_evidence }}
        run: |
          set -euo pipefail
          args=(--verify-tag --title "$TAG")
          case "$CLOUD_EVIDENCE" in
            green) args+=(--generate-notes) ;;
            waiver) args+=(--notes-file "$RUNNER_TEMP/release-notes/notes.md") ;;
            *) echo "::error::Missing release evidence decision."; exit 1 ;;
          esac
          [ "$PRERELEASE" = "true" ] && args+=(--prerelease)
          gh release create "$TAG" "${args[@]}" dist/*
