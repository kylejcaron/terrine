name: scale

# Resource-bound scale, oracle and live-warehouse checks. Too slow for every
# push; run weekly and on demand.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: scale
  cancel-in-progress: false

env:
  # One test at a time: each scale test saturates the 2-CPU runner (DuckDB uses
  # every core), so parallel workers only contend and trip the hang guards.
  PYTEST_ADDOPTS: -n 0

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: uv sync --locked --group dev --all-extras
      - run: make test-scale
