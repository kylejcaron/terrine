name: scale

# Resource-bound scale, oracle and live-warehouse checks, plus the example
# scripts other than the first-dataset tutorial. Too slow for every push; run
# weekly and on demand.
on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: scale
  cancel-in-progress: false

env:
  # One test at a time: each scale test saturates the 2-CPU runner (DuckDB uses
  # every core), so parallel workers only contend and trip the hang guards.
  PYTEST_ADDOPTS: -n 0

jobs:
  scale:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # PostgreSQL cases of the scale tier run against a service container.
    services:
      postgres:
        image: postgres:16
        env: {POSTGRES_PASSWORD: terrine, POSTGRES_DB: terrine_test}
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      TERRINE_TEST_POSTGRES_HOST: localhost
      TERRINE_TEST_POSTGRES_PORT: "5432"
      TERRINE_TEST_POSTGRES_USER: postgres
      TERRINE_TEST_POSTGRES_PASSWORD: terrine
      TERRINE_TEST_POSTGRES_DB: terrine_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --group dev --all-extras
      - run: PYTEST_TIME='/usr/bin/time -f "terrine-pytest-cpu %U %S"' make test-scale
