schema_version: 1
day_boundary: '+00:00'
dialect: duckdb
sources:
  world_events:
    relation: {kind: table, name: world_events}
    timestamp: ts
    entities: {user: unit_id}
    facts: [engagement, revenue]
    properties: [kind, engagement_score, plan_tier, baseline_enabled]
    dimensions: [world_attributes]
facts:
  engagement: {source: world_events, column: null}
  revenue: {source: world_events, column: value}
properties:
  kind:
    source: world_events
    column: kind
    dtype: string
    as_of: event_time
  engagement_score:
    source: world_events
    column: x
    dtype: float
    as_of: event_time
    dimension: world_attributes
  plan_tier:
    source: world_events
    column: plan_tier
    dtype: string
    as_of: event_time
    dimension: world_attributes
  baseline_enabled:
    source: world_events
    column: baseline_enabled
    dtype: bool
    as_of: event_time
    dimension: world_attributes
dimensions:
  world_attributes:
    relation: {kind: table, name: world_attributes}
    source_entity: user
    entity_column: unit_id
    validity: {valid_from: valid_from, valid_to: valid_to}
    properties: [engagement_score, plan_tier, baseline_enabled]
measures:
  engagement_count:
    fact: engagement
    aggregation: count
    filters: [{property: kind, op: equals, value: engagement}]
  revenue_sum:
    fact: revenue
    aggregation: sum
    filters: [{property: kind, op: equals, value: revenue}]
metrics:
  sessions: {kind: mean, entity: user, measure: engagement_count}
  net_revenue: {kind: mean, entity: user, measure: revenue_sum}
