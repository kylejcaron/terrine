[project]
name = "terrine"
version = "0.1.0"
description = "Typed dataset construction and analytical workflows"
readme = "README.md"
requires-python = ">=3.13,<3.15"
dependencies = [
    "ibis-framework>=10,<13",
    "pydantic>=2,<3",
    "PyYAML>=6,<7",
    "sqlglot>=25,<30",
    "pyarrow>=18,<24",
    "numpy>=2,<3",
]

[project.scripts]
terrine = "terrine.runtime.cli:main"

[project.optional-dependencies]
duckdb = ["ibis-framework[duckdb]>=10,<13", "duckdb>=1,<2"]
pandas = ["pandas>=2.2,<4"]
polars = ["polars>=1.21,<2"]
airflow = ["apache-airflow==3.3.2", "apache-airflow-providers-standard==1.20.1"]
dagster = ["dagster==1.13.26"]
dbt = ["dbt-core==1.10.13", "dbt-duckdb==1.9.6"]
increment = ["increment==0.1.0a2"]
doubleml = ["doubleml==0.11.4"]
dowhy = ["dowhy==0.14; python_version < '3.14'"]
duckreg = ["duckreg==0.4.1"]
lifelines = ["lifelines==0.30.3"]
diff-diff = ["diff-diff==3.13.0"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "hypothesis>=6,<7",
    "pytest-xdist>=3,<4",
    "ruff>=0.11,<1",
    "ty>=0.0.1a0",
    "tach>=0.20,<1",
    "vulture>=2.14,<3",
    "pydoclint>=0.6,<1",
    "complexipy>=4,<6",
    "prek>=0.2,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=10 -m 'not slow'"
markers = [
    "slow: tests excluded from the ordinary suite",
    "handoffs: optional downstream library integration examples",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"


[tool.vulture]
paths = ["terrine"]
min_confidence = 80

[tool.pydoclint]
style = "google"
# Signatures own types; coded refusals are constructed through typed factories.
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-raises = true

[tool.complexipy]
max-complexity = 15
