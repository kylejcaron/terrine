[project]
name = "terrine"
version = "0.1.0.dev0"
description = "Typed dataset construction and analytical workflows"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.txt"]
requires-python = ">=3.13,<3.15"
dependencies = [
    "ibis-framework>=11,<13",
    "pydantic>=2.8.1,<3",
    "PyYAML>=6.0.2,<7",
    "sqlglot>=29,<30",
    "pyarrow>=18,<24",
    "numpy>=2.1,<3",
]

[project.scripts]
terrine = "terrine.runtime.cli:main"

[project.optional-dependencies]
duckdb = ["ibis-framework[duckdb]>=11,<13", "duckdb==1.5.6"]
# Ibis 11 PostgreSQL as-of lowering filters units after choosing the nearest row.
postgres = ["ibis-framework[postgres]>=12,<13"]
pandas = ["pandas>=2.2,<4"]
polars = ["polars>=1.21,<2"]
airflow = ["apache-airflow==3.3.2", "apache-airflow-providers-standard==1.20.1"]
dagster = ["dagster==1.13.26"]
dbt = ["dbt-core==1.10.13", "dbt-duckdb==1.9.6"]
increment = ["increment==0.1.0a2"]
sketches = ["datasketches>=5.2,<6"]
doubleml = ["doubleml==0.11.4"]
dowhy = ["dowhy==0.14; python_version < '3.14'"]
duckreg = ["duckreg==0.4.1"]
lifelines = ["lifelines==0.30.3"]
diff-diff = ["diff-diff==3.13.0"]

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "jsonschema>=4,<5",
    "hypothesis>=6,<7",
    "pytest-xdist>=3,<4",
    "pytest-split>=0.11,<1",
    "ruff>=0.11,<1",
    "ty>=0.0.1a0",
    "tach>=0.20,<1",
    "vulture>=2.14,<3",
    "complexipy>=4,<6",
    "prek>=0.2,<1",
]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terrine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --durations=0 --durations-min=5.0 -n 8 -m 'not scale and not postgres'"
markers = [
    "scale: resource-bound scale, oracle and live-warehouse checks; scheduled tier only",
    "postgres: live PostgreSQL probes; need TERRINE_TEST_POSTGRES_* settings",
    "handoffs: optional downstream library integration examples",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.13"


[tool.vulture]
paths = ["terrine"]
min_confidence = 80

[tool.pydoclint]
style = "google"
# Signatures own types; coded refusals are constructed through typed factories.
arg-type-hints-in-docstring = false
check-return-types = false
skip-checking-raises = true

[tool.complexipy]
max-complexity = 15
